<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Success - Signature Recorded</title>
    
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class", theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        
        .loader {
            width: 60px; aspect-ratio: 2;
            --_g: no-repeat radial-gradient(circle closest-side, currentColor 90%, transparent);
            background: var(--_g) 0% 50%, var(--_g) 50% 50%, var(--_g) 100% 50%;
            background-size: calc(100%/3) 50%;
            animation: l3 1s infinite linear;
        }
        @keyframes l3 {
            20% {background-position: 0% 0%, 50% 50%, 100% 50%}
            40% {background-position: 0% 100%, 50% 0%, 100% 50%}
            60% {background-position: 0% 50%, 50% 100%, 100% 0%}
            80% {background-position: 0% 50%, 50% 50%, 100% 100%}
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#121214] dark:text-gray-100 min-h-screen font-sans antialiased flex flex-col">

<div id="loader-overlay" class="fixed inset-0 z-[999] bg-white dark:bg-[#121214] flex justify-center items-center transition-opacity duration-500 text-black dark:text-white">
    <div class="loader"></div>
</div>

<header class="w-full flex justify-between items-center px-4 md:px-8 h-16 bg-white dark:bg-[#1a1a1e] border-b border-gray-200 dark:border-gray-800 shadow-sm">
    <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-black dark:text-white">gavel</span>
        <h1 class="font-bold text-lg tracking-tight">Student Grievance Portal</h1>
    </div>
    <button class="p-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" onclick="toggleTheme()">
        <span class="material-symbols-outlined text-gray-600 dark:text-gray-300">dark_mode</span>
    </button>
</header>

<main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-white dark:bg-[#1a1a1e] border border-gray-100 dark:border-gray-800 p-8 md:p-12 text-center rounded-xl shadow-2xl">
        <span class="material-symbols-outlined text-6xl text-green-600 dark:text-green-500 mb-4">check_circle</span>
        
        <h2 class="text-3xl font-bold mb-4 text-gray-900 dark:text-white">Signature Verified</h2>
        <p class="text-gray-600 dark:text-gray-300 mb-10 leading-relaxed text-sm md:text-base">
            Thank you for standing with the student body. Your signature has been securely recorded. To make this protest work, we need maximum participation. Please share this immediately.
        </p>

        <div class="space-y-4">
            <a href="https://api.whatsapp.com/send?text=URGENT%3A%20I%20just%20signed%20the%20petition%20against%20the%20new%20fee%20and%20attendance%20mandates.%20Please%20sign%20it%20here%20so%20we%20can%20present%20it%20to%20management%3A%20https%3A%2F%2Fyour-portal-link.com" 
               target="_blank" 
               class="w-full h-14 rounded-lg bg-[#25D366] text-white font-semibold uppercase tracking-wider hover:bg-[#1ebe57] transition-all flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                </svg>
                Share to WhatsApp Group
            </a>
            
            <button onclick="copyLink()" class="w-full h-14 rounded-lg border-2 border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white font-semibold uppercase tracking-wider hover:bg-gray-100 dark:hover:bg-gray-800 transition-all flex items-center justify-center gap-3" id="copy-btn">
                <span class="material-symbols-outlined">content_copy</span>
                <span>Copy Petition Link</span>
            </button>
        </div>

        <div class="mt-8">
            <a href="index.html" class="text-sm text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white underline transition-colors">Return to Home</a>
        </div>
    </div>
</main>

<script>
    function toggleTheme() {
        const html = document.documentElement;
        html.classList.toggle('dark');
        localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    }

    window.addEventListener('load', () => {
        setTimeout(() => {
            const loader = document.getElementById('loader-overlay');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            }
        }, 500);
    });

    function copyLink() {
        const btn = document.getElementById('copy-btn');
        // Updated with your live Render URL
        const link = "https://student-portal-vi2l.onrender.com";
        navigator.clipboard.writeText(link); 
        
        btn.innerHTML = '<span class="material-symbols-outlined text-green-500">check</span> <span class="text-green-500">Link Copied!</span>';
        btn.classList.add('border-green-500');
        
        setTimeout(() => {
            btn.innerHTML = '<span class="material-symbols-outlined">content_copy</span> <span>Copy Petition Link</span>';
            btn.classList.remove('border-green-500');
        }, 3000);
    }

    function shareOnWhatsApp() {
        const message = `We are gathering to finalize our strategy and present a verified mass petition officially to management on Wednesday, 17/06/26. A united front from every department is necessary to ensure our concerns are addressed.

CRs, please forward this message to your respective groups immediately. Additionally, coordinate with the IT CRs to join the core planning group.

For the record of our digital signatures, please fill out your details here: https://student-portal-vi2l.onrender.com`;
        
        const url = `https://wa.me/?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }
</script>
</body>
</html>
