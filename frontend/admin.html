<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CR Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            header { display: none !important; }
            body { background: white !important; color: black !important; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="no-print w-full flex justify-between items-center px-6 h-16 bg-white border-b border-gray-200">
    <h1 class="font-bold text-xl">CR Admin Dashboard</h1>
    <button onclick="window.print()" class="bg-black text-white px-4 py-2 rounded">Print Report</button>
</header>

<main class="p-6 max-w-5xl mx-auto">
    <h2 class="text-2xl font-bold mb-6">Petition Data</h2>
    <div class="bg-white rounded-lg border shadow-sm p-4">
        <table class="w-full text-left">
            <thead>
                <tr class="border-b">
                    <th class="p-4">Name</th>
                    <th class="p-4">Roll No.</th>
                    <th class="p-4">Dept</th>
                    <th class="p-4">Sem</th>
                </tr>
            </thead>
            <tbody id="data-table">
                <!-- Data will be loaded here via JS -->
            </tbody>
        </table>
    </div>
</main>

<script>
    // Simple fetch to get signatures (requires your server.js route)
    async function loadData() {
        const password = prompt("Enter Admin Password:");
        const response = await fetch(`/api/signatures?password=${password}`);
        const data = await response.json();
        
        const table = document.getElementById('data-table');
        table.innerHTML = data.map(s => `
            <tr class="border-b">
                <td class="p-4">${s.name}</td>
                <td class="p-4">${s.rollNo}</td>
                <td class="p-4">${s.department}</td>
                <td class="p-4">${s.semester}</td>
            </tr>
        `).join('');
    }
    loadData();
</script>
</body>
</html>
